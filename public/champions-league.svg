<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ballGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#0e2a6d"/>
      <stop offset="100%" stop-color="#050b1f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#ballGrad)" stroke="#00f2fe" stroke-width="2" />
  
  <!-- Central Star and Surrounding Stars (UEFA Champions League Starball Pattern) -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Central Star -->
    <polygon points="50,38 53,46 62,47 55,52 57,60 50,55 43,60 45,52 38,47 47,46" />
    <!-- Top Star -->
    <polygon points="50,15 52,21 58,22 53,26 55,32 50,28 45,32 47,26 42,22 48,21" />
    <!-- Bottom Left Star -->
    <polygon points="26,68 30,71 31,76 34,71 39,72 35,67 38,62 33,64 29,60 29,66" />
    <!-- Bottom Right Star -->
    <polygon points="74,68 71,66 71,60 67,64 62,62 65,67 61,72 66,71 69,76 70,71" />
    <!-- Top Left Star -->
    <polygon points="25,32 30,34 32,39 34,34 40,33 35,29 37,24 32,27 27,24 29,29" />
    <!-- Top Right Star -->
    <polygon points="75,32 71,29 73,24 68,27 63,24 65,29 60,33 66,34 68,39 70,34" />
  </g>
</svg>
